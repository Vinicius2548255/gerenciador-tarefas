<div class="container">
  <h2>Cadastro de Tarefas</h2>
  
  <form class="form-tarefa">
    <div class="form-group">
      <label for="nome">Nome da tarefa:</label>
      <input type="text" id="nome" placeholder="Digite o nome da tarefa" />
    </div>

    <div class="form-group">
      <label for="descricao">Descrição:</label>
      <textarea id="descricao" placeholder="Descreva a tarefa"></textarea>
    </div>

    <div class="form-group">
      <label for="data">Data de vencimento:</label>
      <input type="date" id="data" />
    </div>

    <button type="submit" class="btn-cadastrar">Cadastrar tarefa</button>
  </form>

  <hr />

  <h2>Minhas Tarefas</h2>
  <!-- Seu loop de tarefas aqui -->
</div>
